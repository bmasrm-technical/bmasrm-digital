<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14120F"/>
      <stop offset="50%" stop-color="#0A0908"/>
      <stop offset="100%" stop-color="#1A1713"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#D2B277" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0A0908" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D2B277" stop-opacity="0"/>
      <stop offset="50%" stop-color="#D2B277" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#D2B277" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="600" cy="360" r="320" fill="url(#goldGlow)"/>

  <!-- Geometric luxury frame -->
  <rect x="150" y="100" width="900" height="600" fill="none" stroke="#D2B277" stroke-opacity="0.2" stroke-width="1"/>
  <rect x="170" y="120" width="860" height="560" fill="none" stroke="#D2B277" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Gold diamond emblem -->
  <g transform="translate(600, 320)">
    <polygon points="0,-70 70,0 0,70 -70,0" fill="none" stroke="#D2B277" stroke-width="2"/>
    <polygon points="0,-45 45,0 0,45 -45,0" fill="none" stroke="#D2B277" stroke-opacity="0.5" stroke-width="1"/>
    <circle cx="0" cy="0" r="10" fill="#D2B277"/>
  </g>

  <!-- Typography -->
  <text x="600" y="450" text-anchor="middle" font-family="'Bodoni Moda', serif" font-size="34" font-weight="700" fill="#F3EEE4" letter-spacing="4">
    LUXURY RESTAURANT
  </text>
  <line x1="450" y1="480" x2="750" y2="480" stroke="url(#goldLine)" stroke-width="1.5"/>
  <text x="600" y="520" text-anchor="middle" font-family="'Jost', sans-serif" font-size="14" font-weight="600" fill="#D2B277" letter-spacing="6">
    SIGNATURE DIGITAL PRESENCE • CASE STUDY
  </text>
</svg>
